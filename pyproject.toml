[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odem"
version = "0.1.0"
description = "Online Dynamic Expectation Maximisation for online generalised predictive coding."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pillow>=10",
  "ruamel.yaml>=0.18",
  "scipy>=1.11",
  "torch>=2.2",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
odem = "odem.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["odem*", "algorithms*", "functions*", "data_utils*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
